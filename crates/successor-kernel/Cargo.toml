[package]
name = "successor-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]

[lints]
workspace = true

[dependencies]
successor-protocol = { path = "../successor-protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Post-acceptance schema amendment (agent://252-ToolSchemaAmendmentDissent,
# ruling 1): derives real JSON Schemas for the four executable Slice 0 tool
# argument DTOs (`tools::{search_files,read,find,grep}`) so the published
# tool catalog carries a non-null `input_schema` per tool. Version pinned to
# match `successor-protocol`'s existing `schemars` dependency exactly.
schemars = { version = "0.8", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
# Lane C8 `KernelLocalRpc` (Dissent ruling 1, full-RPC stage): local RPC/SSE
# substrate for `build_router`/`serve`. `tokio-stream` converts the C2
# `KernelFrameStream` broadcast receiver into an axum SSE body stream.
# Lane C6 `KernelToolSearchFindGrep` bootstrap deps (Dissent ruling 2): bounded
# `search_files`/`find`/`grep` discovery over the C5 filesystem substrate.
# `default-features = false` on `regex` drops the full Unicode property/script
# tables (`unicode-age`/`unicode-bool`/`unicode-case`/`unicode-gencat`/
# `unicode-script`/`unicode-segment`) and the alternate-engine perf knobs
# (`perf-dfa`/`perf-onepass`/`perf-backtrack`/`perf-literal`/`perf-inline`);
# `unicode-perl` is kept so `\w`/`\d`/`\s`/`\b` and Unicode-aware case folding
# still work for grepping arbitrary source text. `globset` and `walkdir` have
# no default features worth disabling beyond `globset`'s `log` integration.
# `ignore` is explicitly NOT a dependency: no gitignore/hidden-file semantics
# (Dissent ruling 2; contract §8.2 "unless implementation explicitly records
# why not").
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
globset = { version = "0.4", default-features = false }
walkdir = "2"
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
# Test-only: binds the accepted platform router (successor-context-platform::http::build_router)
# on 127.0.0.1:0 with a real temp SQLite DB and exercises KernelPlatformClient over real TCP
# (Dissent ruling 2). Neither crate appears in the production dependency graph beyond what Lane
# C8 now also requires there (verified via `cargo tree -p successor-kernel -e normal`).
successor-context-platform = { path = "../successor-context-platform" }
# Lane C8 (Dissent ruling 1): `Router` oneshot dispatch in `tests/slice0_kernel_rpc.rs` without
# binding a real TCP listener.
tower = { version = "0.5", features = ["util"] }
