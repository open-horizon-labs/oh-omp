[package]
name = "successor-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]

[lints]
workspace = true

[dependencies]
successor-protocol = { path = "../successor-protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# Lane C6 `KernelToolSearchFindGrep` bootstrap deps (Dissent ruling 2): bounded
# `search_files`/`find`/`grep` discovery over the C5 filesystem substrate.
# `default-features = false` on `regex` drops the full Unicode property/script
# tables (`unicode-age`/`unicode-bool`/`unicode-case`/`unicode-gencat`/
# `unicode-script`/`unicode-segment`) and the alternate-engine perf knobs
# (`perf-dfa`/`perf-onepass`/`perf-backtrack`/`perf-literal`/`perf-inline`);
# `unicode-perl` is kept so `\w`/`\d`/`\s`/`\b` and Unicode-aware case folding
# still work for grepping arbitrary source text. `globset` and `walkdir` have
# no default features worth disabling beyond `globset`'s `log` integration.
# `ignore` is explicitly NOT a dependency: no gitignore/hidden-file semantics
# (Dissent ruling 2; contract §8.2 "unless implementation explicitly records
# why not").
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
globset = { version = "0.4", default-features = false }
walkdir = "2"

[dev-dependencies]
# Test-only: binds the accepted platform router (successor-context-platform::http::build_router)
# on 127.0.0.1:0 with a real temp SQLite DB and exercises KernelPlatformClient over real TCP
# (Dissent ruling 2). `axum` is required alongside it to call `axum::serve` on the returned
# `axum::Router` value — Rust does not expose a dependency's transitive dependencies for direct
# `use`, so serving the router in-process is not reachable through `successor-context-platform`
# alone. Neither crate appears in the production dependency graph (verified via
# `cargo tree -p successor-kernel -e normal`). Flagged as a reopen candidate against ruling 1's
# literal wording, which named only the `successor-context-platform` entry.
successor-context-platform = { path = "../successor-context-platform" }
axum = "0.8"
