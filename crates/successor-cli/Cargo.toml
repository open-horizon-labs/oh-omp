[package]
name = "successor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "successor-cli"

[lints]
workspace = true

[dependencies]
successor-protocol = { path = "../successor-protocol" }
successor-kernel = { path = "../successor-kernel" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# Test-only (D2 BlackBoxIntegrationSmoke, reopen grant): binds the accepted
# platform router (successor-context-platform::http::serve) on 127.0.0.1:0 with
# a real temp SQLite DB, alongside a real successor-kernel router, to exercise
# the compiled successor-cli binary end to end over real HTTP/SSE. Neither
# crate appears in the production dependency graph beyond what successor-kernel
# itself already requires there.
successor-context-platform = { path = "../successor-context-platform" }
